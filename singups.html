<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Findit.</title>
        <link rel="stylesheet" href="stylesignup.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    </head>
    <body>
        <div class = "header">
            <br>
            <h1 style="margin-top: 50px;scale: 200%;text-align: center;color: black;">Find<span style =
            "color:hsl(0, 75%, 52%);">it.</span></h1>
            <h2 style = "scale: 75%; margin-top: 25px;text-align: center; font-family: 'Poppins',
            sans-serif;">A place to find lost things</h2>
        </div>
            <div class="app-icon" style="display: flex; justify-content: center;
            align-items: center; height: 90px;">
                <p class="material-icons"style="margin-top:150px; scale: 100%;font-size: 100px; color:
            hsl(0, 75%, 52%);;">radar</p>
       
        </div>
        <br>
        <form action = "home.html">
            <div class = "container"><span style = "font-family: 'Poppins',
            sans-serif;text-align: center;">
       
            <div class = "question">
                <label>Full Name:</label><br>
                <input id = "nameS" type="text" placeholder="Enter your Full Name"style = "width:
                250px; padding: 5px; border-radius : 7px;"required>
            </div>
            <div class = "question">
                <label>Email:</label><br>
                <input id = "emailS"type ="email" placeholder = "Enter your Email"style = "width:
                250px; padding: 5px; border-radius: 7px;"required>
            </div>
            <div class = "question">
                <label>Password:</label><br>
                <input id = "passwordS"type="password" placeholder="Enter your Password"style = "width:
                250px; padding: 5px; border-radius: 7px;"required>
            </div>
            <div class = "question">
                <label>Phone Number:</label><br>
                <input id = "pnS"type="tel" placeholder="Enter your phone number"style="width:
                250px; padding: 5px; border-radius: 7px;"required>
            </div>
            <div class = "question">
                <label">School:</label><br>
                <input id = "schoolS"type="text" placeholder="Enter your school"style = "width:
                250px; padding: 5px; border-radius: 7px;"required><br><br>
                <label style = "font-size: 20px;">Zip code:</label><br>
                <input id = "zipS"type="text" placeholder="Zip code"style = "width: 100px;
                padding: 5px; border-radius: 7px;text-align: center;"required>
            </div>
            <div>
                <button class="button" onclick = "loginbutton()" style="width: 400px;" type = “submit”>Submit</button>
            </div>




        </form>
        </div>
        </span>



        <script src="home.js"></script>
    </body>
</html>
